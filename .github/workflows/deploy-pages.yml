name: Deploy GitHub Pages

on:
  push:
    branches:
      - rooc
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p dist
          cp index.html public.html styles.css app.js public.js config.js dist/
          cp -R assets dist/assets
          touch dist/.nojekyll
          node <<'NODE'
          const fs = require('fs');
          const url = process.env.SUPABASE_URL || '';
          const anonKey = process.env.SUPABASE_ANON_KEY || '';
          if (url && anonKey) {
            fs.writeFileSync(
              'dist/config.js',
              `window.ROOC_SUPABASE_CONFIG = ${JSON.stringify({ url, anonKey }, null, 2)};\n`
            );
          }
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
